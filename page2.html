
<!DOCTYPE html>

    <title>Image Border Examples</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .gallery img {
            border-color: #8b5cf6;
            border-width: 4px;
            border-style: solid;

            width: 130px;
            height: 65px;

            padding: 5px;
            margin: 12px;

            border-radius: 8px;
            box-shadow: 0 0 12px #8b5cf6;

            transition: 0.3s;
        }

        .gallery img:hover {
            border-color: #00e5ff;
            box-shadow: 0 0 18px #00e5ff;
        }

    </style>
</head>
